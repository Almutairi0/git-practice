name: "👋 أنا مشارك في الورشة"
description: افتح هذي الـIssue أول شي، وبتربطها بالـPull Request حقك
title: "Add <username> to participants"
labels: ["participant"]
body:
  - type: input
    id: name
    attributes:
      label: اسمك
    validations:
      required: true
  - type: input
    id: username
    attributes:
      label: اسم المستخدم في GitHub
      placeholder: octocat
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: مستواك في Git قبل الورشة
      options:
        - أول مرة أسمع فيه
        - استخدمته شوي
        - أستخدمه بشكل يومي
    validations:
      required: true
